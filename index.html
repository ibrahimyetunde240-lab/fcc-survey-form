<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Development Learning Survey</title>
</head>
<body>
  <header>
    <h1 id="title">Web Development Learning Survey</h1>
    <p id="description">Help us understand your experience and preferences while learning web development.</p>
  </header>

  <main>
    <form id="survey-form">
      <label for="name" id="name-label">Name:</label>
      <input type="text" id="name" name="name" required placeholder="Enter your name">
      <br />

      <label for="email" id="email-label">Email Address:</label>
      <input type="email" id="email" name="email" required placeholder="Enter your email">
      <br />

      <label for="number" id="number-label">Age:</label>
      <input type="number" id="number" name="age" min="2" max="100" placeholder="Enter your age">
      <br />

      <label for="dropdown">Which best describes your current role?</label>
      <select name="role" id="dropdown">
        <option selected disabled value="">Select your role</option>
        <option value="student">Student</option>
        <option value="worker">Worker</option>
        <option value="self-learner">Self-Learner</option>
      </select>
      <br />

      <p>How would you describe your coding experience?</p>
      <input type="radio" id="beginner" name="experience" value="beginner">
      <label for="beginner">Beginner</label>
      <input type="radio" id="learning" name="experience" value="learning">
      <label for="learning">Currently Learning</label>
      <br />

      <p>What would you like to see improved? (Check all that apply)</p>
      <input type="checkbox" id="projects" name="improvement" value="projects">
      <label for="projects">More Projects</label>
      <input type="checkbox" id="guidance" name="improvement" value="guidance">
      <label for="guidance">More Guidance</label>
      <input type="checkbox" id="practice" name="improvement" value="practice">
      <label for="practice">More Practice</label>
      <br />

      <label for="comments">Other Comments?</label>
      <textarea cols="30" rows="10" name="comments" id="comments" placeholder="Share your thoughts"></textarea>
      <br />

      <button type="submit" id="submit">Submit</button>
    </form>
  </main>
</body>
</html>
